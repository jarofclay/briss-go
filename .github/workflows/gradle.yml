# This workflow builds the legacy Java Briss in legacy-java/ with Gradle.
# The Java tree stays until the Go rewrite reaches parity; it also produces the
# golden data the Go tests compare against (legacy-java/tools/golden).
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version:
          - 8.0.462+8
          - 11.0.28+6
          - 17.0.16+8
          - 19.0.2+7
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Create bundle
        run: ./gradlew shadowDistZip
      - name: Run automated tests
        run: ./gradlew test
      - name: Archive package
        uses: actions/upload-artifact@v4
        with:
          name: Briss-2.0-${{ matrix.java-version }}
          path: legacy-java/build/distributions/*.zip
