# Desktop app: test it, then build ready-to-run downloads for Linux, macOS
# (Apple silicon and Intel) and Windows. On a v* tag the downloads are also
# attached to the release goreleaser drafts for that tag (release.yml); a manual
# run with "release_tag" set replaces them on that release. On a tag or a manual
# run the macOS app is signed with the Developer ID and notarized when the
# MACOS_* secrets are set (scripts/macos/signing-setup.sh lists them); otherwise
# it gets an ad-hoc signature. Fyne needs cgo and OpenGL headers,
# which the runners have (Linux gets them from apt), so people who only want
# to use Briss do not have to install a C compiler. Find the files under
# Actions > GUI > the latest run > Artifacts.

name: GUI

on:
  push:
    branches: [master, claude/gui]
    tags: ["v*"] # path filters are not applied to tag pushes
    paths: ["gui/**", "internal/**", "assets/logo/**", "scripts/macos/**", "scripts/linux/**", "go.mod", "go.sum", ".github/workflows/gui.yml"]
  pull_request:
    branches: [master]
    paths: ["gui/**", "internal/**", "assets/logo/**", "scripts/macos/**", "scripts/linux/**", "go.mod", "go.sum", ".github/workflows/gui.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach the downloads to the release for this tag (for example v2.0.0-beta), replacing files of the same name"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Briss-linux-amd64
          - os: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
            artifact: Briss-macos
          - os: windows-latest
            artifact: Briss-windows-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to attach the downloads to a tagged release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Test the core
        run: go test ./...
      - name: Test the app
        working-directory: gui
        run: go test ./...
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: gui
        run: |
          mkdir -p ../dist/Briss
          go build -trimpath -ldflags "-s -w" -o ../dist/Briss/briss-gui .
          cp ../LICENSE.txt ../scripts/linux/install.sh ../scripts/linux/README.txt ../dist/Briss/
          cp ../assets/logo/png/briss-256.png ../dist/Briss/briss.png
          chmod 755 ../dist/Briss/briss-gui ../dist/Briss/install.sh
          tar -C ../dist -czf ../dist/${{ matrix.artifact }}.tar.gz Briss
          tar -tvzf ../dist/${{ matrix.artifact }}.tar.gz
      - name: Check the PDF engine under the hardened runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          # A notarized app runs under the hardened runtime, and the PDF engine compiles
          # code while it runs; scripts/macos/entitlements.plist allows that. Sign the
          # command line ad hoc with the same options and run it. (GitHub's Macs ran it
          # even without the entitlement, so they may enforce less than a user's Mac.)
          go build -o "$RUNNER_TEMP/briss" ./cmd/briss
          codesign --force --options runtime --entitlements scripts/macos/entitlements.plist --sign - "$RUNNER_TEMP/briss"
          scripts/macos/check-engine.sh "$RUNNER_TEMP/briss" darwin "$(go env GOARCH)"
      - name: Set up Developer ID signing (macOS)
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: scripts/macos/signing-setup.sh
      - name: Build (macOS app, Apple silicon and Intel)
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        # the same script builds the app on a Mac by hand (README, "Build the app on a Mac")
        run: |
          for arch in arm64 amd64; do
            scripts/macos/build-app.sh $arch "$TAG"
          done
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: gui
        shell: bash
        run: |
          mkdir -p ../dist
          # the icon comes from rsrc_windows_amd64.syso (assets/logo/winres.py)
          go build -trimpath -ldflags "-H windowsgui -s -w" -o ../dist/Briss.exe .
          python ../assets/logo/check_winres.py ../dist/Briss.exe
          cd ../dist && 7z a -tzip Briss-windows-amd64.zip Briss.exe ../LICENSE.txt
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip)
          # goreleaser creates the (draft) release; wait for it
          for i in $(seq 1 90); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
