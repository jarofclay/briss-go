# Release builds of the briss command line (PLAN.md section 11). PDFium runs as
# WebAssembly, so every target builds with CGO disabled on one runner.
# Check locally with: goreleaser check && goreleaser release --snapshot --clean
version: 2
project_name: briss

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: briss
    main: ./cmd/briss
    binary: briss
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        # macOS programs: Developer ID signature and notarization when the
        # release workflow set them up, then a check that the PDF engine still runs
        # under the hardened runtime; other systems pass straight through.
        - cmd: ./scripts/macos/sign.sh "{{ .Path }}" {{ .Os }}
          output: true
        - cmd: ./scripts/macos/check-engine.sh "{{ .Path }}" {{ .Os }} {{ .Arch }}
          output: true

archives:
  - id: briss
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.txt
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^spike:"

release:
  name_template: "Briss {{ .Version }}"
  draft: true
  prerelease: auto
