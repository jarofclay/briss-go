  </defs>
  <g transform="translate(100 100) scale(0.8046875)"><g filter="url(#tileShadow)"><g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#halo)"/>
    <path d="M270 136 H656 L788 268 V854 Q788 888 754 888 H270 Q236 888 236 854 V170 Q236 136 270 136 Z" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="6" stroke-linejoin="round"/>
