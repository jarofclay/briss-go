<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3a"/><stop offset=".55" stop-color="#12141b"/><stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#4d8dff" stop-opacity=".30"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e9ef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab8ff"/><stop offset=".5" stop-color="#4d8dff"/><stop offset="1" stop-color="#2f6bea"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
